name: Deploy da develop na VPS

# Customização DESTE fork (IanCouto/DeskcommCRM). Não abra PR disto para o
# upstream: o `publish-image.yml` de lá só publica `main` e tags `v*`, e é
# assim de propósito — `develop` aqui é um canal móvel da instalação desta VPS,
# não do parque inteiro.
#
# Doutrina: a VPS NÃO builda. Os runners do GitHub constroem as três imagens,
# publicam em ghcr.io/<dono>/…:develop, e o servidor só faz `docker compose pull`.
#
# Secrets (Settings → Secrets and variables → Actions), neste repositório:
#   VPS_HOST     IP da VPS
#   VPS_PORT     porta do SSH (nesta HostGator não é 22)
#   VPS_USER     usuário SSH (root)
#   VPS_SSH_KEY  chave privada ed25519 só para este job (não a chave pessoal)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-vps-develop
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    if: github.repository == 'IanCouto/DeskcommCRM' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deskcommcrm
            dockerfile: Dockerfile
            title: DeskcommCRM
          - name: deskcomm-worker
            dockerfile: Dockerfile.worker
            title: DeskcommCRM worker
          - name: deskcomm-scheduler
            dockerfile: Dockerfile.scheduler
            title: DeskcommCRM scheduler
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolver APP_VERSION
        id: ver
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=develop
            type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.value }}
          cache-from: type=gha,scope=develop-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=develop-${{ matrix.name }}

      - name: Tornar o pacote público (a VPS precisa puxar)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.name }}
        run: |
          set -euo pipefail
          gh api --method PUT \
            "/user/packages/container/${PKG}/visibility" \
            -f visibility=public \
            || echo "::warning::não consegui tornar ${PKG} público — o deploy faz login com o token do job"

  imagem-do-app-sobe:
    if: github.repository == 'IanCouto/DeskcommCRM' && github.ref == 'refs/heads/develop'
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Puxar a imagem que acabou de publicar
        run: |
          set -euo pipefail
          dono=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          docker pull "${REGISTRY}/${dono}/deskcommcrm:${GITHUB_SHA}"
          docker tag "${REGISTRY}/${dono}/deskcommcrm:${GITHUB_SHA}" deskcomm-smoke:develop

      - name: O container chega a servir?
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3000:3000 \
            -e NEXT_PUBLIC_SUPABASE_URL=https://exemplo.supabase.co \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY=chave-de-mentira \
            -e SUPABASE_SERVICE_ROLE_KEY=chave-de-mentira \
            -e SUPABASE_DB_URL=postgres://u:p@127.0.0.1:5432/postgres \
            -e SENTRY_DSN=off \
            deskcomm-smoke:develop

          pronto=nao
          for _ in $(seq 1 40); do
            if ! docker ps --filter name=smoke --filter status=running -q | grep -q .; then
              echo "::error::o container do app MORREU durante o boot"
              docker logs smoke 2>&1 | tail -40
              exit 1
            fi
            if docker logs smoke 2>&1 | grep -qE "Ready in|started server on"; then
              pronto=sim
              break
            fi
            sleep 3
          done

          if [ "$pronto" != "sim" ]; then
            echo "::error::o app não chegou a servir em 120s"
            docker logs smoke 2>&1 | tail -40
            exit 1
          fi

          if docker logs smoke 2>&1 | grep -q "MODULE_NOT_FOUND"; then
            echo "::error::falta módulo no standalone"
            docker logs smoke 2>&1 | grep -A5 MODULE_NOT_FOUND | head -20
            exit 1
          fi

          echo "o app chegou a servir:"
          docker logs smoke 2>&1 | grep -E "Ready in|Next.js" | head -3

      - name: Encerrar
        if: always()
        run: docker rm -f smoke 2>/dev/null || true

  deploy-vps:
    if: github.repository == 'IanCouto/DeskcommCRM' && github.ref == 'refs/heads/develop'
    needs: [build-and-push, imagem-do-app-sobe]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: SSH na VPS e atualizar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          SHA: ${{ github.sha }}
          DONO: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for v in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              echo "::error::falta o secret $v (Settings → Secrets and variables → Actions)"
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # scp usa -P (maiúsculo) para a porta; ssh usa -p. Misturar os dois
          # numa array só faz o scp ler `-p` como "preservar timestamp".
          ident=(-o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519)
          scp -P "$VPS_PORT" "${ident[@]}" .github/scripts/deploy-vps-develop.sh \
            "${VPS_USER}@${VPS_HOST}:/tmp/deploy-vps-develop.sh"

          dono=$(printf '%s' "$DONO" | tr '[:upper:]' '[:lower:]')
          # Token vai por stdin (uma linha), não na linha de comando do ssh.
          printf '%s\n' "$GH_TOKEN" | ssh -p "$VPS_PORT" "${ident[@]}" "${VPS_USER}@${VPS_HOST}" \
            "read GH_TOKEN; export GH_TOKEN GH_USER=$(printf '%q' "$GH_USER") SHA=$(printf '%q' "$SHA") DONO=$(printf '%q' "$dono"); bash /tmp/deploy-vps-develop.sh"
